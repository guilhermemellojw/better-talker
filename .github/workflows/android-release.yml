name: Release APK (signed)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BT_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
      BT_KEYSTORE_PASSWORD: ${{ secrets.BT_KEYSTORE_PASSWORD }}
      BT_KEY_ALIAS: ${{ secrets.BT_KEY_ALIAS }}
      BT_KEY_PASSWORD: ${{ secrets.BT_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            android/*.gradle*
            android/app/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        run: |
          sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses > /dev/null 2>&1 || true
          mkdir -p android
          cat > android/local.properties <<EOF
          sdk.dir=/usr/local/lib/android/sdk
          EOF

      - name: Require release keystore secrets
        env:
          BT_KEYSTORE_BASE64: ${{ secrets.BT_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$BT_KEYSTORE_BASE64" ] || [ -z "$BT_KEYSTORE_PASSWORD" ] \
            || [ -z "$BT_KEY_ALIAS" ] || [ -z "$BT_KEY_PASSWORD" ]; then
            echo "::error::Configure BT_KEYSTORE_BASE64, BT_KEYSTORE_PASSWORD, BT_KEY_ALIAS e BT_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$BT_KEYSTORE_BASE64" | base64 -d > "$BT_KEYSTORE_FILE"
          chmod 600 "$BT_KEYSTORE_FILE"
          test -s "$BT_KEYSTORE_FILE"

      - name: Run unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Lint release
        working-directory: android
        run: ./gradlew :app:lintRelease --no-daemon --console=plain

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Verify release signature (not debug)
        working-directory: android
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk | tee /tmp/apksigner.txt
          ! grep -qi "Android Debug" /tmp/apksigner.txt

      - name: SHA-256
        working-directory: android
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-talker-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" \
              android/app/build/outputs/apk/release/app-release.apk \
              android/app/build/outputs/apk/release/app-release.apk.sha256 \
              --title "Better Talker ${GITHUB_REF_NAME}" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" \
              android/app/build/outputs/apk/release/app-release.apk \
              android/app/build/outputs/apk/release/app-release.apk.sha256 \
              --title "Better Talker ${GITHUB_REF_NAME}" --generate-notes
          fi
