name: Coordenação — suíte Python host-only

# Certificação automatizada dos componentes Python da coordenação.
# A preparação de dependências é online e separada; as duas suítes executam
# dentro de um network namespace sem rede, com o guard Python como defesa
# adicional. Nenhum segredo, token, `gh`, push, serviço real, sessão OpenCode,
# LLM, Gradle, Android, ADB ou transporte é utilizado.
on:
  push:
    paths:
      - '.opencode/scripts/**'
      - '.opencode/agents/**'
      - '.opencode/*.md'
      - '.opencode/deploy/**'
      - 'docs/**'
      - '.github/workflows/coord-python.yml'
      - '.github/requirements-ci.txt'
  pull_request:
    paths:
      - '.opencode/scripts/**'
      - '.opencode/agents/**'
      - '.opencode/*.md'
      - '.opencode/deploy/**'
      - 'docs/**'
      - '.github/workflows/coord-python.yml'
      - '.github/requirements-ci.txt'
  workflow_dispatch:
    inputs:
      crossuid_full:
        description: 'Executar a certificação cross-UID completa G1-G9'
        required: true
        default: false
        type: boolean
      certified_sha:
        description: 'SHA 40-hex previamente certificado; obrigatório quando crossuid_full=true'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  coord-python:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.crossuid_full == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (somente leitura)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar dependências online (fora do namespace)
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r .github/requirements-ci.txt
          python3 -c 'import yaml; print("PY-YAML-READY", yaml.__version__)'

      - name: Preparar caminhos experimentais esperados
        # O runner é efêmero e passwordless sudo é usado apenas para criar
        # symlinks canônicos e abrir o network namespace; os testes rodam como
        # o usuário runner via setpriv, sem root.
        run: |
          set -euo pipefail
          sudo -n mkdir -p /home/guilherme/Documentos
          sudo -n ln -sfn "$GITHUB_WORKSPACE" /home/guilherme/Documentos/better-talker
          sudo -n ln -sfn "$GITHUB_WORKSPACE" /home/guilherme/Documentos/better-talker-coord-supervisor-shadow
          readlink -f /home/guilherme/Documentos/better-talker-coord-supervisor-shadow
          echo "EXPECTED-WORKTREE-READY"

      - name: Isolar HOME/TMPDIR/armazenamento
        run: |
          set -euo pipefail
          COORD_HOME="$RUNNER_TEMP/coord-home"
          COORD_TMP="$RUNNER_TEMP/coord-tmp"
          COORD_STATE="$RUNNER_TEMP/coord-state"
          COORD_LOGS="$RUNNER_TEMP/coord-logs"
          mkdir -p "$COORD_HOME" "$COORD_TMP" "$COORD_STATE" "$COORD_LOGS"
          sudo -n mkdir -p /repo
          sudo -n ln -sfn "$GITHUB_WORKSPACE" /repo/wt
          echo "ISOLATION-READY"

      - name: Provar TCP/UDP/DNS/subprocesso no namespace sem rede
        run: |
          set -euo pipefail
          sudo -n unshare -n -- /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            /usr/bin/env -i PATH="$pythonLocation/bin:/usr/bin:/bin" LANG=C LC_ALL=C \
            python3 "$GITHUB_WORKSPACE/.opencode/scripts/ci_network_probe.py" --mode os

      - name: Provar guarda Python como defesa adicional
        run: |
          set -euo pipefail
          env -i PATH="$pythonLocation/bin:/usr/bin:/bin" LANG=C LC_ALL=C \
            PYTHONPATH="$GITHUB_WORKSPACE/.opencode/scripts/ci_netguard" \
            python3 "$GITHUB_WORKSPACE/.opencode/scripts/ci_network_probe.py" --mode guard

      - name: unittest discover dentro do namespace (baseline 558)
        run: |
          set -euo pipefail
          COORD_HOME="$RUNNER_TEMP/coord-home"
          COORD_TMP="$RUNNER_TEMP/coord-tmp"
          COORD_STATE="$RUNNER_TEMP/coord-state"
          COORD_LOGS="$RUNNER_TEMP/coord-logs"
          sudo -n unshare -n -- /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            /usr/bin/env -i HOME="$COORD_HOME" TMPDIR="$COORD_TMP" \
            XDG_STATE_HOME="$COORD_STATE" PATH="$pythonLocation/bin:/usr/bin:/bin" LANG=C LC_ALL=C \
            PYTHONPATH="$GITHUB_WORKSPACE/.opencode/scripts/ci_netguard" \
            python3 "$GITHUB_WORKSPACE/.opencode/scripts/ci_discover.py" \
              "$GITHUB_WORKSPACE/.opencode/scripts" 2>&1 | tee "$COORD_LOGS/discover.log"
          count=$(grep -Eo 'Ran [0-9]+ tests' "$COORD_LOGS/discover.log" | awk '{print $2}')
          echo "DISCOVER_TESTS=$count"
          [ "$count" = "558" ] || { echo "BASELINE-DISCOVER-DIVERGENT"; exit 1; }

      - name: Serviço de fronteira de confiança (baseline 40)
        run: |
          set -euo pipefail
          COORD_HOME="$RUNNER_TEMP/coord-home"
          COORD_TMP="$RUNNER_TEMP/coord-tmp"
          COORD_STATE="$RUNNER_TEMP/coord-state"
          COORD_LOGS="$RUNNER_TEMP/coord-logs"
          sudo -n unshare -n -- /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            /usr/bin/env -i HOME="$COORD_HOME" TMPDIR="$COORD_TMP" \
            XDG_STATE_HOME="$COORD_STATE" PATH="$pythonLocation/bin:/usr/bin:/bin" LANG=C LC_ALL=C \
            PYTHONPATH="$GITHUB_WORKSPACE/.opencode/scripts/ci_netguard:$GITHUB_WORKSPACE/.opencode/scripts" \
            python3 "$GITHUB_WORKSPACE/.opencode/scripts/test_coord_trust_service.py" 2>&1 | tee "$COORD_LOGS/trust-service.log"
          count=$(grep -Eo 'Ran [0-9]+ tests' "$COORD_LOGS/trust-service.log" | awk '{print $2}')
          echo "TRUST_SERVICE_TESTS=$count"
          [ "$count" = "40" ] || { echo "BASELINE-TRUST-SERVICE-DIVERGENT"; exit 1; }

      - name: Probe cross-UID de SCM_CREDENTIALS (descartável; não cria usuários)
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.opencode/scripts/coord_trust_cross_uid_probe.py"

      - name: Provar detecção de regressão intencional dentro do namespace
        run: |
          set -euo pipefail
          COORD_HOME="$RUNNER_TEMP/coord-home"
          COORD_TMP="$RUNNER_TEMP/coord-tmp"
          COORD_STATE="$RUNNER_TEMP/coord-state"
          COORD_LOGS="$RUNNER_TEMP/coord-logs"
          PROBE="$COORD_LOGS/regression-probe"
          mkdir -p "$PROBE"
          printf '%s\n' \
            'import unittest' \
            'class Intencional(unittest.TestCase):' \
            '    def test_regressao(self):' \
            '        self.assertTrue(False, "REGRESSAO-INTENCIONAL-DETECTADA")' \
            > "$PROBE/test_intencional.py"
          set +e
          sudo -n unshare -n -- /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            /usr/bin/env -i HOME="$COORD_HOME" TMPDIR="$COORD_TMP" \
            XDG_STATE_HOME="$COORD_STATE" PATH="$pythonLocation/bin:/usr/bin:/bin" LANG=C LC_ALL=C \
            PYTHONPATH="$GITHUB_WORKSPACE/.opencode/scripts/ci_netguard" \
            python3 "$GITHUB_WORKSPACE/.opencode/scripts/ci_discover.py" "$PROBE" \
            > "$COORD_LOGS/regression-probe.log" 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "CI-NAO-DETECTA-REGRESSAO"; exit 1; }
          grep -q "REGRESSAO-INTENCIONAL-DETECTADA" "$COORD_LOGS/regression-probe.log"
          echo "REGRESSION-DETECTION-OK rc=$rc"

      - name: Suíte do supervisor dentro do namespace (baseline 167)
        if: always()
        run: |
          set -euo pipefail
          COORD_HOME="$RUNNER_TEMP/coord-home"
          COORD_TMP="$RUNNER_TEMP/coord-tmp"
          COORD_STATE="$RUNNER_TEMP/coord-state"
          COORD_LOGS="$RUNNER_TEMP/coord-logs"
          sudo -n unshare -n -- /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            /usr/bin/env -i HOME="$COORD_HOME" TMPDIR="$COORD_TMP" \
            XDG_STATE_HOME="$COORD_STATE" PATH="$pythonLocation/bin:/usr/bin:/bin" LANG=C LC_ALL=C \
            PYTHONPATH="$GITHUB_WORKSPACE/.opencode/scripts/ci_netguard:$GITHUB_WORKSPACE/.opencode/scripts" \
            python3 "$GITHUB_WORKSPACE/.opencode/scripts/test_supervisor.py" 2>&1 | tee "$COORD_LOGS/supervisor.log"
          count=$(grep -Eo '[0-9]+ passed, 0 failed' "$COORD_LOGS/supervisor.log" | awk '{print $1}')
          echo "SUPERVISOR_TESTS=$count"
          [ "$count" = "167" ] || { echo "BASELINE-SUPERVISOR-DIVERGENT"; exit 1; }
          total=$((count + 558))
          echo "TOTAL_TESTS=$total"
          [ "$total" = "725" ] || { echo "BASELINE-TOTAL-DIVERGENT"; exit 1; }

      - name: Sanitizar logs e publicar resultado
        if: always()
        run: |
          set -euo pipefail
          COORD_LOGS="$RUNNER_TEMP/coord-logs"
          python3 - "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$COORD_LOGS" <<'PY'
          import os
          import sys
          runner_temp, workspace, logs = sys.argv[1:4]
          for name in ("discover.log", "supervisor.log", "trust-service.log", "regression-probe.log"):
              path = os.path.join(logs, name)
              if not os.path.isfile(path):
                  continue
              with open(path, encoding="utf-8", errors="replace") as handle:
                  text = handle.read()
              for secret_path in (runner_temp, workspace):
                  text = text.replace(secret_path, "<path>")
              with open(path + ".sanitized", "w", encoding="utf-8") as handle:
                  handle.write(text)
          print("LOGS-SANITIZED")
          PY
          echo "RESULTADO: discover=558 supervisor=167 total=725 (namespace sem rede; guard adicional)"

      - name: Publicar logs sanitizados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coord-python-logs
          path: ${{ runner.temp }}/coord-logs/*.sanitized
          if-no-files-found: ignore

  crossuid:
    name: Cross-UID descartável (manual, SHA certificado)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.crossuid_full == true && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: coord-trust-crossuid
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CERTIFIED_SHA: ${{ inputs.certified_sha }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      WORK_ROOT: /tmp/coord-trust-p4-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validar SHA certificado informado
        run: |
          set -euo pipefail
          certified="${CERTIFIED_SHA:-}"
          [[ "$certified" =~ ^[0-9a-f]{40}$ ]] || { echo "CERTIFIED-SHA-INVALID"; exit 1; }
          [ "$GITHUB_SHA" = "$certified" ] || { echo "GITHUB-SHA-DIVERGENT"; exit 1; }
          echo "CERTIFIED-SHA-FORMAT-OK"

      - name: Checkout do SHA certificado (somente leitura)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          persist-credentials: false

      - name: Verificar SHA certificado após checkout
        run: |
          set -euo pipefail
          certified="${CERTIFIED_SHA:-}"
          actual="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          [ "$actual" = "$certified" ] || { echo "CERTIFIED-SHA-DIVERGENT"; exit 1; }
          echo "CERTIFIED-SHA-OK $certified"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pré-condições do runner descartável
        run: |
          set -euo pipefail
          sudo -n true
          command -v setpriv
          command -v unshare
          command -v setsid
          command -v ssh-keygen
          command -v python3
          test "$(id -u)" != "0"
          [ "${GITHUB_RUN_ATTEMPT:-}" = "1" ] || { echo "RUN-ATTEMPT-BLOCKED"; exit 1; }
          python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version_info'
          test -f "$GITHUB_WORKSPACE/.opencode/scripts/coord_trust_crossuid_harness.py"
          echo "CROSSUID-PRECONDITIONS-OK"

      - name: Certificação cross-UID G1-G9 (runner descartável)
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/crossuid-out"
          HOME_DIR="$RUNNER_TEMP/crossuid-home"
          TMP_DIR="$RUNNER_TEMP/crossuid-tmp"
          mkdir -p "$OUT" "$HOME_DIR" "$TMP_DIR"
          sudo -n setsid --wait unshare -n -- /usr/bin/env -i \
            HOME="$HOME_DIR" TMPDIR="$TMP_DIR" \
            PATH="$pythonLocation/bin:/usr/local/bin:/usr/bin:/bin" \
            LANG=C LC_ALL=C \
            PYTHONPATH="$GITHUB_WORKSPACE/.opencode/scripts" \
            COORD_TRUST_RUN_ID="$RUN_ID" \
            python3 "$GITHUB_WORKSPACE/.opencode/scripts/coord_trust_crossuid_harness.py" \
              --repo "$GITHUB_WORKSPACE" \
              --output "$OUT" \
              --run-id "$RUN_ID" \
              --work-root "$WORK_ROOT" \
              --deadline-seconds 480

      - name: Sanitizar logs e resumo
        if: always()
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/crossuid-out"
          mkdir -p "$OUT"
          python3 - "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$OUT" "$WORK_ROOT" <<'PY'
          import os
          import re
          import sys
          runner_temp, workspace, out, work_root = sys.argv[1:5]
          replacements = (runner_temp, workspace, work_root)
          private_key = re.compile(
              r"-----BEGIN (?:OPENSSH )?PRIVATE KEY-----.*?"
              r"-----END (?:OPENSSH )?PRIVATE KEY-----", re.S)
          for name in ("crossuid.log", "service-logs.log", "summary.json"):
              source = os.path.join(out, name)
              if not os.path.isfile(source):
                  continue
              with open(source, encoding="utf-8", errors="replace") as handle:
                  text = handle.read()
              for value in replacements:
                  text = text.replace(value, "<path>")
              text = private_key.sub("<redacted-private-key>", text)
              target = os.path.join(out, name + ".sanitized")
              with open(target, "w", encoding="utf-8") as handle:
                  handle.write(text)
          print("CROSSUID-LOGS-SANITIZED")
          PY
          if [ -f "$OUT/crossuid.log.sanitized" ]; then
            cat "$OUT/crossuid.log.sanitized"
          fi

      - name: Publicar artefatos sanitizados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coord-trust-crossuid
          path: |
            ${{ runner.temp }}/crossuid-out/summary.json.sanitized
            ${{ runner.temp }}/crossuid-out/crossuid.log.sanitized
            ${{ runner.temp }}/crossuid-out/service-logs.log.sanitized
          if-no-files-found: warn

      - name: Limpeza independente do runner
        if: always()
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/crossuid-out"
          MANIFEST="$OUT/cleanup.json"
          case "$WORK_ROOT" in
            /tmp/coord-trust-p4-*) ;;
            *) echo "CROSSUID-CLEANUP-WORK-ROOT-INVALID"; exit 1 ;;
          esac
          sudo -n python3 - "$MANIFEST" "$RUN_ID" "$WORK_ROOT" <<'PY'
          import json
          import os
          import signal
          import sys
          import time

          manifest_path, run_id, work_root = sys.argv[1:4]
          marker = ("COORD_TRUST_RUN_ID=" + run_id).encode("ascii", "strict")
          pgrps = set()
          if os.path.isfile(manifest_path):
              try:
                  with open(manifest_path, encoding="utf-8") as handle:
                      manifest = json.load(handle)
                  if manifest.get("run_id") == run_id:
                      expected_work = manifest.get("work_root")
                      if expected_work != work_root:
                          print("CROSSUID-CLEANUP-MANIFEST-DIVERGENT")
                          raise SystemExit(1)
                      pgrps.update(int(value) for value in manifest.get(
                          "process_groups", []))
              except (OSError, ValueError, TypeError):
                  print("CROSSUID-CLEANUP-MANIFEST-INVALID")
          # Escopo por marcador único da execução, nunca por nome de processo.
          for entry in os.listdir("/proc"):
              if not entry.isdigit():
                  continue
              pid = int(entry)
              try:
                  with open(f"/proc/{pid}/stat", encoding="utf-8") as handle:
                      fields = handle.read().split()
                  pgrp = int(fields[4])
                  with open(f"/proc/{pid}/environ", "rb") as handle:
                      environ = handle.read()
              except (OSError, ValueError, IndexError):
                  continue
              if marker in environ:
                  pgrps.add(pgrp)
          for pgid in sorted(pgrps):
              if pgid <= 1:
                  continue
              try:
                  os.killpg(pgid, signal.SIGTERM)
              except OSError:
                  pass
          time.sleep(0.2)
          for pgid in sorted(pgrps):
              if pgid <= 1:
                  continue
              try:
                  os.killpg(pgid, signal.SIGKILL)
              except OSError:
                  pass
          print(f"CROSSUID-CLEANUP-PGRPS={len(pgrps)}")
          PY
          sudo -n rm -rf -- "$WORK_ROOT" \
            "$RUNNER_TEMP/crossuid-home" "$RUNNER_TEMP/crossuid-tmp" \
            "$OUT"
          echo "CROSSUID-CLEANUP-OK"
