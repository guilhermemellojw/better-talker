name: Build Android APK

on:
  workflow_dispatch:
  push:
    # Valida todo push (main e branches de trabalho), não só a main.
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Cache do Gradle (wrapper + caches de dependências/build).
          cache: 'gradle'
          cache-dependency-path: |
            android/*.gradle*
            android/app/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        run: |
          sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses > /dev/null 2>&1 || true
          mkdir -p android
          cat > android/local.properties <<EOF
          sdk.dir=/usr/local/lib/android/sdk
          EOF

      - name: Write google-services.json (per flavor)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app/src/syncBeta android/app/src/publicApp
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/src/syncBeta/google-services.json
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/src/publicApp/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Confirm Firebase config boundaries
        run: |
          for flavor in syncBeta publicApp; do
            if [ -f "android/app/src/$flavor/google-services.json" ]; then
              echo "$flavor google-services.json present"
              grep -E "project_id|package_name" "android/app/src/$flavor/google-services.json"
            else
              echo "$flavor google-services.json MISSING -> compila com Firebase inativo"
            fi
          done
          if [ -f android/app/google-services.json ]; then
            echo "::error::google-services.json na raiz do app vazaria para os flavors."
            exit 1
          fi

      - name: Run unit tests
        id: unit_tests
        working-directory: android
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:testPublicAppDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-test.log

      - name: Show test failure log
        if: steps.unit_tests.outcome == 'failure'
        working-directory: android
        run: |
          echo "::group::Gradle test log (last 100 lines)"
          tail -100 gradle-test.log || true
          echo "::endgroup::"
          echo "::group::Errors only"
          grep -iE "error|FAILURE|what went wrong|Caused by|could not|cannot|unable|tests completed" gradle-test.log | tail -40 || true
          echo "::endgroup::"
          exit 1

      - name: Upload test reports (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: better-talker-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Lint release
        id: lint_release
        working-directory: android
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintPublicAppRelease --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-lint.log

      - name: Show lint failure log
        if: steps.lint_release.outcome == 'failure'
        working-directory: android
        run: |
          echo "::group::Gradle lint log (last 100 lines)"
          tail -100 gradle-lint.log || true
          echo "::endgroup::"
          echo "::group::Errors only"
          grep -iE "error|FAILURE|what went wrong|Caused by|Lint found" gradle-lint.log | tail -40 || true
          echo "::endgroup::"
          exit 1

      - name: Upload lint reports (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: better-talker-lint-reports
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Build debug APK
        id: build_apk
        working-directory: android
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assemblePublicAppDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Show Gradle failure log
        if: steps.build_apk.outcome == 'failure'
        working-directory: android
        run: |
          echo "::group::Gradle build log (last 80 lines)"
          tail -80 gradle-build.log || true
          echo "::endgroup::"
          echo "::group::Errors only"
          grep -iE "error|FAILURE|what went wrong|Caused by|could not|cannot|unable" gradle-build.log | tail -30 || true
          echo "::endgroup::"
          exit 1

      # O build incremental já gerou APK com assinatura v2 inválida em uma
      # validação local (crash no FirebaseInitProvider). O check impede
      # publicar um APK corrompido sem falhar o job.
      - name: Verify APK signature
        working-directory: android
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/publicApp/debug/app-publicApp-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: better-talker-debug
          path: android/app/build/outputs/apk/publicApp/debug/
          if-no-files-found: error

      # O flavor beta precisa compilar mesmo sem o secret (sync fica inativo).
      - name: Build syncBeta debug APK
        working-directory: android
        run: ./gradlew :app:assembleSyncBetaDebug --no-daemon --console=plain

      - name: Upload syncBeta debug APK
        uses: actions/upload-artifact@v4
        with:
          name: better-talker-syncbeta-debug
          path: android/app/build/outputs/apk/syncBeta/debug/
          if-no-files-found: error
