name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses > /dev/null 2>&1 || true
          mkdir -p android
          cat > android/local.properties <<EOF
          sdk.dir=/usr/local/lib/android/sdk
          EOF

      - name: Write google-services.json (if configured)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Confirm native Firebase config
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json present -> Google Services plugin will apply"
            grep -E "project_id|package_name" android/app/google-services.json
          else
            echo "google-services.json MISSING -> build sem Firebase (100% local)"
          fi

      - name: Build debug APK
        id: build_apk
        working-directory: android
        continue-on-error: true
        run: ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Show Gradle failure log
        if: steps.build_apk.outcome == 'failure'
        working-directory: android
        run: |
          echo "::group::Gradle build log (last 80 lines)"
          tail -80 gradle-build.log || true
          echo "::endgroup::"
          echo "::group::Errors only"
          grep -iE "error|FAILURE|what went wrong|Caused by|could not|cannot|unable" gradle-build.log | tail -30 || true
          echo "::endgroup::"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: better-talker-debug
          path: android/app/build/outputs/apk/debug/
          if-no-files-found: error
