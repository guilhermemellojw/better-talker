name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses > /dev/null 2>&1 || true
          mkdir -p android
          cat > android/local.properties <<EOF
          sdk.dir=/usr/local/lib/android/sdk
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Write google-services.json (if configured)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build debug APK
        id: build_apk
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log
        continue-on-error: true

      - name: Show Gradle failure log
        if: failure() && steps.build_apk.conclusion == 'failure'
        working-directory: android
        run: |
          echo "::group::Gradle build log (last 80 lines)"
          tail -80 gradle-build.log || true
          echo "::endgroup::"
          echo "::group::Errors only"
          grep -iE "error|FAILURE|what went wrong|Caused by|could not|cannot|unable" gradle-build.log | tail -30 || true
          echo "::endgroup::"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: better-talker-debug
          path: android/app/build/outputs/apk/debug/
          if-no-files-found: error