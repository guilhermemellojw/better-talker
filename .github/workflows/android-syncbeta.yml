name: Build syncBeta APK (signed, experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BT_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
      BT_KEYSTORE_PASSWORD: ${{ secrets.BT_KEYSTORE_PASSWORD }}
      BT_KEY_ALIAS: ${{ secrets.BT_KEY_ALIAS }}
      BT_KEY_PASSWORD: ${{ secrets.BT_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            android/*.gradle*
            android/app/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        run: |
          sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses > /dev/null 2>&1 || true
          mkdir -p android
          cat > android/local.properties <<EOF
          sdk.dir=/usr/local/lib/android/sdk
          EOF

      - name: Require beta secrets
        env:
          BT_KEYSTORE_BASE64: ${{ secrets.BT_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          for v in BT_KEYSTORE_BASE64 BT_KEYSTORE_PASSWORD BT_KEY_ALIAS BT_KEY_PASSWORD GOOGLE_SERVICES_JSON; do
            if [ -z "${!v}" ]; then
              echo "::error::Configure o secret $v."
              exit 1
            fi
          done
          printf '%s' "$BT_KEYSTORE_BASE64" | base64 -d > "$BT_KEYSTORE_FILE"
          chmod 600 "$BT_KEYSTORE_FILE"
          test -s "$BT_KEYSTORE_FILE"
          mkdir -p android/app/src/syncBeta
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/src/syncBeta/google-services.json
          grep -q 'com.bettertalker.app' android/app/src/syncBeta/google-services.json

      - name: Run unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testSyncBetaDebugUnitTest --no-daemon --console=plain

      - name: Build signed syncBeta APK
        working-directory: android
        run: ./gradlew :app:assembleSyncBetaRelease --no-daemon --console=plain

      - name: Verify beta signature (not debug)
        working-directory: android
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/syncBeta/release/app-syncBeta-release.apk | tee /tmp/apksigner-beta.txt
          ! grep -qi "Android Debug" /tmp/apksigner-beta.txt

      - name: SHA-256
        working-directory: android
        run: |
          cd app/build/outputs/apk/syncBeta/release
          sha256sum app-syncBeta-release.apk > app-syncBeta-release.apk.sha256
          cat app-syncBeta-release.apk.sha256

      - name: Upload beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-talker-syncbeta
          path: |
            android/app/build/outputs/apk/syncBeta/release/app-syncBeta-release.apk
            android/app/build/outputs/apk/syncBeta/release/app-syncBeta-release.apk.sha256
          if-no-files-found: error
