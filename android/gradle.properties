# ============================================================
# Gradle daemon — heap controlado para 8GB de RAM
# ============================================================
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# ============================================================
# Kotlin compile daemon — heap separado e limitado
# ============================================================
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m

# ============================================================
# Controle de paralelismo (evita pico de RAM)
# ============================================================
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.configureondemand=true

# ============================================================
# Cache de build (economiza tempo sem custo de RAM)
# ============================================================
org.gradle.caching=true

# ============================================================
# Configurações originais mantidas
# ============================================================
android.useAndroidX=true
android.builder.sdkDownload=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=true