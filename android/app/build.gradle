plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace = "com.bettertalker.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bettertalker.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    packaging { resources { excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1'] } }
}

dependencies {
    // Compose BOM + Material3
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBomVersion}")
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation "androidx.activity:activity-compose:${rootProject.ext.androidxActivityVersion}"
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation "androidx.navigation:navigation-compose:${rootProject.ext.navigationComposeVersion}"
    implementation "androidx.fragment:fragment-ktx:${rootProject.ext.androidxFragmentVersion}"
    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:${rootProject.ext.lifecycleVersion}"

    // Room (notas + anexos)
    implementation "androidx.room:room-runtime:${rootProject.ext.roomVersion}"
    implementation "androidx.room:room-ktx:${rootProject.ext.roomVersion}"
    kapt "androidx.room:room-compiler:${rootProject.ext.roomVersion}"

    // DataStore + WorkManager
    implementation "androidx.datastore:datastore-preferences:${rootProject.ext.datastoreVersion}"
    implementation "androidx.work:work-runtime-ktx:${rootProject.ext.workVersion}"

    // Leitura local PDF (BYOD, 100% offline). EPUB lido via java.util.zip (sem dep).
    implementation "com.tom-roush:pdfbox-android:${rootProject.ext.pdfBoxVersion}"

    // Firebase (Auth + Firestore) — runtime só ativa com google-services.json
    implementation platform("com.google.firebase:firebase-bom:${rootProject.ext.firebaseBomVersion}")
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Login Google via Credential Manager
    implementation "androidx.credentials:credentials:${rootProject.ext.credentialsVersion}"
    implementation "androidx.credentials:credentials-play-services-auth:${rootProject.ext.credentialsVersion}"
    implementation "com.google.android.gms:play-services-auth:${rootProject.ext.playAuthVersion}"
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

// Firebase SEM o plugin google-services (incompatível com AGP 8.13):
// gera os mesmos string resources que o plugin geraria, lendo o json.
// Sem o json, o build segue 100% local e o Firebase fica inativo em runtime.
def gsFile = file('google-services.json')
if (gsFile.exists() && gsFile.text.contains('project_id')) {
    def gs = new groovy.json.JsonSlurper().parse(gsFile)
    def client = gs.client.find {
        it.client_info.android_client_info.package_name == 'com.bettertalker.app'
    } ?: gs.client[0]
    android.defaultConfig.resValue 'string', 'google_app_id', client.client_info.mobilesdk_app_id
    android.defaultConfig.resValue 'string', 'gcm_defaultSenderId', gs.project_info.project_number
    android.defaultConfig.resValue 'string', 'google_api_key', client.api_key[0].current_key
    android.defaultConfig.resValue 'string', 'project_id', gs.project_info.project_id
    if (gs.project_info.firebase_url) {
        android.defaultConfig.resValue 'string', 'firebase_database_url', gs.project_info.firebase_url
    }
    if (gs.project_info.storage_bucket) {
        android.defaultConfig.resValue 'string', 'google_storage_bucket', gs.project_info.storage_bucket
    }
    def webClient = client.oauth_client?.find { it.client_type == 3 }
    if (webClient?.client_id) {
        android.defaultConfig.resValue 'string', 'default_web_client_id', webClient.client_id
    }
    logger.lifecycle('[BetterTalker] Firebase resources gerados do google-services.json (login + Firestore ativos).')
} else {
    logger.lifecycle('[BetterTalker] google-services.json ausente: build 100% local, sem Firebase.')
}
