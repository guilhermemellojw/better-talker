plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace = "com.bettertalker.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bettertalker.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    packaging { resources { excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1'] } }
}

dependencies {
    // Compose BOM + Material3
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBomVersion}")
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation "androidx.activity:activity-compose:${rootProject.ext.androidxActivityVersion}"
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation "androidx.navigation:navigation-compose:${rootProject.ext.navigationComposeVersion}"
    implementation "androidx.fragment:fragment-ktx:${rootProject.ext.androidxFragmentVersion}"
    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:${rootProject.ext.lifecycleVersion}"

    // Room (notas + anexos)
    implementation "androidx.room:room-runtime:${rootProject.ext.roomVersion}"
    implementation "androidx.room:room-ktx:${rootProject.ext.roomVersion}"
    kapt "androidx.room:room-compiler:${rootProject.ext.roomVersion}"

    // DataStore + WorkManager
    implementation "androidx.datastore:datastore-preferences:${rootProject.ext.datastoreVersion}"
    implementation "androidx.work:work-runtime-ktx:${rootProject.ext.workVersion}"

    implementation "com.tom-roush:pdfbox-android:${rootProject.ext.pdfBoxVersion}"

    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
