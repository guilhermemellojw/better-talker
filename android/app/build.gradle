plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}

// A1 — assinatura de release fora do repositório.
// Prioridade: variáveis de ambiente (CI) > android/keystore.properties (local,
// ignorado pelo git). Sem segredo, o release fica sem assinatura e o CI falha
// no passo de verificação — nunca volta a assinar com a debug key.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStoreFile = System.getenv('BT_KEYSTORE_FILE') ?: keystoreProperties.getProperty('storeFile')
def releaseStorePassword = System.getenv('BT_KEYSTORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword')
def releaseKeyAlias = System.getenv('BT_KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('BT_KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "com.bettertalker.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bettertalker.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 69
        versionName "5.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }
        // #23-bench: runtime sherpa-onnx (Kokoro) — só arm64 (A34).
        ndk { abiFilters "arm64-v8a" }
    }
    // M7: o APK público não embute Firebase. O beta de sync é um flavor
    // separado, com Google Services/opt-in próprio. `syncBetaRelease` usa o
    // MESMO applicationId do público; a ordem dos versionCodes é documentada
    // no flavor. `publicApp` continua 100% local.
    flavorDimensions "channel"
    productFlavors {
        publicApp {
            dimension "channel"
            buildConfigField "boolean", "SYNC_BETA", "false"
            buildConfigField "boolean", "CLOUD_SYNC", "true"
        }
        syncBeta {
            dimension "channel"
            buildConfigField "boolean", "SYNC_BETA", "true"
            buildConfigField "boolean", "CLOUD_SYNC", "true"
            // Beta 70 (5.3-syncbeta). Rebuild experimental depois do público
            // 5.3/69; o público não tem Firebase/sync.
            versionCode 70
            versionName "5.3"
            versionNameSuffix "-syncbeta"
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        // Debug NUNCA usa o applicationId do release: instalar um APK debug
        // por cima do release apagaria os dados do usuário (assinaturas
        // diferentes). O pacote separado também casa com o app de matriz.
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            debuggable false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    testOptions {
        // Testes JVM tocam android.util.Log em caminhos de erro (ex.:
        // PiperTtsManager sem en_dict); sem isso o Log real lança.
        unitTests.returnDefaultValues = true
    }
    packaging {
        // F2: os backends do LiteRT/ggml são carregados por caminho no dir de
        // libs nativas — precisam estar extraídos.
        jniLibs { useLegacyPackaging = true }
        resources { excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1'] }
    }
    androidResources {
        // #23-fix-b: o model.onnx (~63MB) já é comprimido internamente —
        // re-comprimir no AAPT só atrasaria o build e a cópia inicial.
        noCompress 'onnx'
    }
}

// Mantém o nome histórico `app-release.apk` no APK público de release
// (o flavor não deve mudar o contrato de download do GitHub Releases).
android.applicationVariants.all { variant ->
    if (variant.flavorName == 'publicApp' && variant.buildType.name == 'release') {
        variant.outputs.all { outputFileName = 'app-release.apk' }
    }
}

dependencies {
    // Compose BOM + Material3
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBomVersion}")
    implementation 'androidx.core:core-ktx:1.17.0'
    // Splash Screen API (Android 12+) — tela de abertura com a marca.
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // F2 — motor on-device (Gemma 4 E2B via LiteRT-LM)
    implementation "androidx.activity:activity-compose:${rootProject.ext.androidxActivityVersion}"
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation "androidx.navigation:navigation-compose:${rootProject.ext.navigationComposeVersion}"
    implementation "androidx.fragment:fragment-ktx:${rootProject.ext.androidxFragmentVersion}"
    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:${rootProject.ext.lifecycleVersion}"
    // v4.2: thumbnails/cache local das imagens da nota.
    implementation "io.coil-kt:coil-compose:2.7.0"
    // 5.4: orientação EXIF antes de normalizar a imagem para WebP.
    implementation "androidx.exifinterface:exifinterface:1.3.7"

    // Room (notas + anexos)
    implementation "androidx.room:room-runtime:${rootProject.ext.roomVersion}"
    implementation "androidx.room:room-ktx:${rootProject.ext.roomVersion}"
    kapt "androidx.room:room-compiler:${rootProject.ext.roomVersion}"

    // DataStore + WorkManager
    implementation "androidx.datastore:datastore-preferences:${rootProject.ext.datastoreVersion}"
    implementation "androidx.documentfile:documentfile:${rootProject.ext.documentFileVersion}"
    implementation "androidx.work:work-runtime-ktx:${rootProject.ext.workVersion}"

    // Editor visual WYSIWYG (markdown segue como formato do Copilot)
    implementation 'com.mohamedrejeb.richeditor:richeditor-compose:1.0.0-rc14'
    // Leitura local PDF (BYOD, 100% offline). EPUB lido via java.util.zip (sem dep).
    implementation "com.tom-roush:pdfbox-android:${rootProject.ext.pdfBoxVersion}"

    // 5.8: Auth + Storage + Firestore existem nos dois flavors. O sync de
    // notas/estrutura é opt-in; o beta mantém o rótulo “Experimental”.
    implementation platform("com.google.firebase:firebase-bom:${rootProject.ext.firebaseBomVersion}")
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-firestore'
    implementation "androidx.credentials:credentials:${rootProject.ext.credentialsVersion}"
    implementation "androidx.credentials:credentials-play-services-auth:${rootProject.ext.credentialsVersion}"
    implementation "com.google.android.gms:play-services-auth:${rootProject.ext.playAuthVersion}"
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation "org.apache.commons:commons-compress:${rootProject.ext.commonsCompressVersion}"
    implementation "org.tukaani:xz:${rootProject.ext.xzVersion}"

    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
    // Fase 10: SQLite real na JVM para validar o SQL das migrations (sem Android).
    testImplementation 'org.xerial:sqlite-jdbc:3.41.2.2'
    // Backup/export: o Android já traz org.json; na JVM o artefato equivalente
    // permite testar o codec sem Robolectric.
    testImplementation 'org.json:json:20240303'
    // #23-bench: teste instrumentado (RTF do Kokoro no A34).
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

// 5.4 — Firebase por flavor. O plugin google-services é incompatível com
// AGP 8.13, então geramos os string resources lendo o json do flavor
// (`src/publicApp` ou `src/syncBeta`, ambos ignorados pelo git). Sem json, o
// flavor compila e o login/Storage ficam inativos.
def firebaseConfigs = [
    publicApp: file('src/publicApp/google-services.json'),
    syncBeta : file('src/syncBeta/google-services.json'),
]

androidComponents {
    onVariants(selector().all()) { variant ->
        def gsFile = firebaseConfigs[variant.flavorName]
        if (gsFile == null || !gsFile.exists() || !gsFile.text.contains('project_id')) {
            logger.lifecycle(
                "[BetterTalker] ${variant.flavorName} sem google-services.json: Firebase inativo."
            )
            return
        }
        def gs = new groovy.json.JsonSlurper().parse(gsFile)
        def clients = gs.client
        def pickClient = { String pkg ->
            clients.find { it.client_info.android_client_info.package_name == pkg }
        }
        // debug usa o pacote .debug; release usa o applicationId público.
        def pkg = variant.applicationId.get()
        def client = pickClient(pkg) ?: pickClient('com.bettertalker.app')
        if (client == null) {
            logger.lifecycle(
                "[BetterTalker] Firebase: cliente ${pkg} ausente no json do ${variant.flavorName}."
            )
            return
        }
        def releaseClient = pickClient('com.bettertalker.app') ?: client
        def fallbackWeb = releaseClient.oauth_client?.find { it.client_type == 3 }
        def webClient = client.oauth_client?.find { it.client_type == 3 } ?: fallbackWeb

        def add = { String name, String value ->
            if (value != null) {
                variant.resValues.put(
                    variant.makeResValueKey('string', name),
                    new com.android.build.api.variant.ResValue(value, null)
                )
            }
        }
        add('google_app_id', client.client_info.mobilesdk_app_id)
        add('gcm_defaultSenderId', gs.project_info.project_number)
        add('google_api_key', client.api_key?.getAt(0)?.current_key)
        add('project_id', gs.project_info.project_id)
        add('firebase_database_url', gs.project_info.firebase_url)
        add('google_storage_bucket', gs.project_info.storage_bucket)
        add('default_web_client_id', webClient?.client_id)
        logger.lifecycle(
            "[BetterTalker] Firebase do ${variant.flavorName} (${pkg}) carregado."
        )
    }
}

// F2: o AAR do LiteRT pede kotlin-stdlib 2.4.x, mas o Room 2.8.5 (kapt) só
// lê metadata Kotlin até 2.3.0 — força o stdlib do projeto (Kotlin 2.3.21).
configurations.all {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'
}
