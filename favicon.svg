<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="rgba(251,191,36,0.3)" stroke-width="2"/>
  <!-- Microphone head -->
  <rect x="36" y="22" width="28" height="42" rx="14" fill="url(#goldGrad)"/>
  <!-- Microphone mesh details -->
  <line x1="39" y1="36" x2="61" y2="36" stroke="#78350f" stroke-width="2"/>
  <line x1="39" y1="44" x2="61" y2="44" stroke="#78350f" stroke-width="2"/>
  <!-- Microphone cradle / ring -->
  <path d="M26 44 C 26 64, 74 64, 74 44" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Stand -->
  <line x1="50" y1="64" x2="50" y2="78" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="34" y1="78" x2="66" y2="78" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Sound / Energy waves -->
  <path d="M16 38 A 20 20 0 0 0 16 50" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M84 38 A 20 20 0 0 1 84 50" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>